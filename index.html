<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>香川 Googleマップまとめ地図</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
#map{height:100%}
.panel{position:fixed;z-index:1000;top:10px;left:10px;right:10px;max-width:620px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 12px #0003}
.row{display:flex;gap:8px}.row input{flex:1;padding:10px;border:1px solid #bbb;border-radius:8px;font-size:14px}.row button{padding:10px 14px;border:0;border-radius:8px;background:#222;color:#fff}
.note{font-size:12px;color:#666;margin-top:7px}
</style>
</head>
<body>
<div class="panel">
  <b>香川 Googleマップまとめ地図</b>
  <div class="row" style="margin-top:8px">
    <input id="url" placeholder="GoogleマップURLを追加する場合はGitHubのurls.txtへ">
    <button onclick="openUrl()">開く</button>
  </div>
  <div class="note">ピンをタップすると元のGoogleマップを開きます。URL追加はGitHubの urls.txt に1行ずつ追加してください。</div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./data.js"></script>
<script>
const points=window.MAP_DATA||[];
const map=L.map('map').setView([34.25,133.85],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const group=[];
points.forEach((p,i)=>{
 const m=L.marker([p.lat,p.lng]).addTo(map);
 m.bindPopup('<b>地点 '+(i+1)+'</b><br><button onclick="location.href='+JSON.stringify(p.url)+'">Googleマップを開く</button>');
 group.push([p.lat,p.lng]);
});
if(group.length) map.fitBounds(group,{padding:[30,30]});
function openUrl(){const u=document.getElementById('url').value.trim();if(u)location.href=u;}
</script>
</body>
</html>
